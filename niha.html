<!DOCTYPE html>
<html>
<head>
    <title>Neha AI - Smart Assistant</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: white; display: flex; flex-direction: column; align-items: center; height: 100vh; margin: 0; }
        #chat-container { width: 90%; max-width: 500px; background: #1e293b; border-radius: 20px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .header { text-align: center; font-size: 24px; font-weight: bold; margin-bottom: 20px; color: #38bdf8; }
        #chat-box { height: 300px; overflow-y: auto; border-bottom: 1px solid #334155; margin-bottom: 10px; padding: 10px; }
        input { width: 80%; padding: 10px; border-radius: 10px; border: none; }
        button { padding: 10px; border-radius: 10px; background: #38bdf8; border: none; color: white; cursor: pointer; }
        .footer { font-size: 12px; color: #64748b; margin-top: 10px; }
    </style>
</head>
<body>
    <div id="chat-container">
        <div class="header">✨ Neha AI</div>
        <div id="chat-box"></div>
        <input type="text" id="userInput" placeholder="Neha se kuch pucho...">
        <button onclick="sendMessage()">Send</button>
        <div class="footer">Created by Raj-don | Powered by Neha Intelligence</div>
    </div>
    <script src="script.js"></script>
</body>
</html>
